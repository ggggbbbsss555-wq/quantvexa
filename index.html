<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QuantVexa — All-in-One Trading Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#fff;overflow:hidden;
}

/* ===== Logo Intro Screen ===== */
.logo-screen{
  position:fixed;inset:0;z-index:2000;
  background:#000;
  display:flex;justify-content:center;align-items:center;
  opacity:1;
  transition:opacity 0.6s ease;
}
.logo-screen.hidden{opacity:0;pointer-events:none}
.logo-container{
  width:460px;height:460px;
  position:relative;z-index:5;
  transform-origin:center center;
  transition:transform 3s cubic-bezier(0.22,1,0.36,1),
             opacity 1.5s ease,
             z-index 0.3s ease 2.5s;
  display:none;
  transform:translateY(20px);
}
.logo-container.shown{display:block}
.logo-container.expanded{
  transform:translateY(20px) scale(2.2);
  opacity:0.25;z-index:0;pointer-events:none;
}
.logo-container svg{width:100%;height:100%;overflow:visible;display:block}
.hexagon-border{
  fill:none;stroke:url(#cyanGrad);
  stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:320;stroke-dashoffset:320;
  animation:drawHex 3s ease-out forwards;
}
.hexagon{
  fill:none;stroke:url(#blueGrad);
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:320;stroke-dashoffset:320;
  animation:drawHex 3s ease-out forwards;
}
.bar{
  animation:growBar 2s ease-out forwards;
  opacity:0;fill:#000;stroke:url(#cyanGrad);
  stroke-width:2;stroke-linejoin:round;
  transform-box:fill-box;transform-origin:center bottom;
}
.bar-2{stroke-width:3}
.notch-fill{
  fill:none;stroke:url(#cyanGrad);
  stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:38;stroke-dashoffset:38;
  animation:revealHead 2s ease-out forwards;
}
.notch-fill-inner{
  fill:none;stroke:url(#blueGrad);
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:38;stroke-dashoffset:38;
  animation:revealHead 2s ease-out forwards;
}
@keyframes drawHex{to{stroke-dashoffset:0}}
@keyframes growBar{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes revealHead{to{stroke-dashoffset:0}}
@media (max-width:600px){
  .logo-container{width:300px;height:300px}
  .logo-container.expanded{transform:translateY(20px) scale(1.6)}
}
@media (max-width:380px){
  .logo-container{width:260px;height:260px}
  .logo-container.expanded{transform:translateY(20px) scale(1.5)}
}

/* ===== Platform Selector Screen ===== */
.platform-screen{
  position:fixed;inset:0;z-index:1900;
  background:#000;
  display:none;flex-direction:column;
  justify-content:center;align-items:center;
  padding:32px 20px;
  opacity:0;
  transition:opacity 0.5s ease;
}
.platform-screen.visible{display:flex;opacity:1}
.platform-screen.hidden{opacity:0;pointer-events:none}
.platform-screen-title{
  font-size:11px;font-weight:700;color:#00d2ff;
  letter-spacing:2.5px;text-transform:uppercase;
  margin-bottom:8px;
}
.platform-screen-heading{
  font-size:22px;font-weight:800;color:#fff;
  margin-bottom:36px;text-align:center;
  letter-spacing:0.3px;
}
.platform-buttons{
  display:flex;flex-direction:column;gap:14px;
  width:100%;max-width:360px;
}
.platform-btn{
  padding:22px 20px;
  background:linear-gradient(180deg,#131313 0%,#080808 100%);
  border:1px solid #1f1f1f;
  border-radius:14px;
  cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:border-color 0.22s ease,background 0.22s ease;
  font-family:inherit;color:inherit;text-align:left;
}
.platform-btn:hover{
  border-color:#00d2ff;
  background:linear-gradient(180deg,rgba(0,210,255,0.06) 0%,#080808 100%);
}
.platform-btn-icon{
  width:48px;height:48px;flex-shrink:0;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);
  border:1px solid #00d2ff;
}
.platform-btn-icon svg{width:26px;height:26px;stroke:#000;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.platform-btn-info{flex:1;min-width:0}
.platform-btn-name{
  font-size:18px;font-weight:800;color:#fff;
  letter-spacing:0.5px;margin-bottom:2px;
}
.platform-btn-desc{
  font-size:11px;color:#888;font-weight:500;
  letter-spacing:0.2px;
}
.platform-btn-arrow{
  color:#555;font-size:18px;font-weight:700;
  transition:color 0.22s ease,transform 0.22s ease;
}
.platform-btn:hover .platform-btn-arrow{
  color:#00d2ff;transform:translateX(3px);
}
@media (max-width:480px){
  .platform-btn{padding:18px 16px}
  .platform-btn-icon{width:42px;height:42px}
  .platform-btn-name{font-size:16px}
}

/* ===== Full-screen iframe container ===== */
.page-container{
  position:fixed;
  inset:0;
  z-index:1;
  background:#000;
}
.page-frame{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  border:none;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
  background:#000;
}
.page-frame.active{
  opacity:1;
  pointer-events:auto;
}

/* Loading overlay */
.frame-loader{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}
.frame-loader.visible{opacity:1;pointer-events:auto}
.frame-loader .spinner{
  width:32px;height:32px;
  border:2px solid rgba(0,210,255,0.2);
  border-top-color:#00d2ff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== Logo Intro Screen ===== -->
<div class="logo-screen" id="logoScreen">
  <div class="logo-container" id="logoContainer">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00d2ff"/>
          <stop offset="40%" style="stop-color:#0099cc"/>
          <stop offset="100%" style="stop-color:#00f0ff"/>
        </linearGradient>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#09111f"/>
          <stop offset="50%" style="stop-color:#000"/>
          <stop offset="100%" style="stop-color:#070d18"/>
        </linearGradient>
        <clipPath id="hexagonClip">
          <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z"/>
        </clipPath>
      </defs>
      <path d="M100 15 L160 50 L160 120 L100 155 L40 120 L40 50 Z" fill="#000"/>
      <g clip-path="url(#hexagonClip)">
        <rect class="bar bar-1" x="60" y="75" width="18" height="85" rx="2"/>
        <rect class="bar bar-3" x="122" y="72" width="18" height="88" rx="2"/>
        <path class="bar bar-2" d="M91 42 L91 160 L109 160 L109 42 Z"/>
      </g>
      <path class="hexagon-border" d="M100 155 L40 120 L40 50 L57.1 40 M100 155 L160 120 L160 50 L142.9 40"/>
      <path class="hexagon" d="M100 155 L40 120 L40 50 L57.1 40 M100 155 L160 120 L160 50 L142.9 40"/>
      <path class="notch-fill" d="M100 14.8 L67 32.25"/>
      <path class="notch-fill" d="M100 14.8 L133 32.25"/>
      <path class="notch-fill-inner" d="M100 14.8 L67 32.25"/>
      <path class="notch-fill-inner" d="M100 14.8 L133 32.25"/>
    </svg>
  </div>
</div>

<!-- ===== Platform Selector Screen ===== -->
<div class="platform-screen" id="platformScreen">
  <div class="platform-screen-title">QuantVexa</div>
  <h1 class="platform-screen-heading">Select Trading Platform</h1>
  <div class="platform-buttons">
    <button class="platform-btn" onclick="selectPlatform('QUOTEX')">
      <div class="platform-btn-icon">
        <svg viewBox="0 0 24 24"><line x1="7" y1="3" x2="7" y2="21"/><rect x="4" y="7" width="6" height="9" fill="#000" fill-opacity="0.15"/><line x1="17" y1="2" x2="17" y2="22"/><rect x="14" y="10" width="6" height="7" fill="#000" fill-opacity="0.15"/></svg>
      </div>
      <div class="platform-btn-info">
        <div class="platform-btn-name">QUOTEX</div>
        <div class="platform-btn-desc">Binary options trading</div>
      </div>
      <div class="platform-btn-arrow">›</div>
    </button>
    <button class="platform-btn" onclick="selectPlatform('BINOLLA')">
      <div class="platform-btn-icon">
        <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
      </div>
      <div class="platform-btn-info">
        <div class="platform-btn-name">BINOLLA</div>
        <div class="platform-btn-desc">Smart advanced trading</div>
      </div>
      <div class="platform-btn-arrow">›</div>
    </button>
  </div>
</div>

<!-- ===== Full-screen iframe container ===== -->
<div class="page-container" id="pageContainer">
  <div class="frame-loader" id="frameLoader"><div class="spinner"></div></div>
  <iframe class="page-frame" id="frame-bots" data-base="dashboard.html"></iframe>
  <iframe class="page-frame" id="frame-chart" data-base="signals.html"></iframe>
  <iframe class="page-frame" id="frame-plans" data-base="wallet.html"></iframe>
  <iframe class="page-frame" id="frame-support" data-base="settings.html"></iframe>
</div>

<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
/* ===== State ===== */
var State = {
  platform: 'QUOTEX',
  currentPage: 'bots',
  loadedFrames: {},
  appReady: false,
  tgUser: null
};

/* ===== Detect base path (works for repo subdirectories) ===== */
function getBasePath(){
  var path = window.location.pathname;
  var dir = path.substring(0, path.lastIndexOf('/') + 1);
  return dir;
}

/* ===== Telegram User Data ===== */
function initTelegram(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      var u = Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
      if(u){
        State.tgUser = {
          id: u.id || '',
          first_name: u.first_name || '',
          last_name: u.last_name || '',
          username: u.username || '',
          photo_url: u.photo_url || '',
          language_code: u.language_code || '',
          full_name: ((u.first_name||'') + ' ' + (u.last_name||'')).trim() || (u.username || 'Trader')
        };
      }
    }
  }catch(e){}

  if(!State.tgUser){
    var p = new URLSearchParams(location.search);
    if(p.get('tg_id')){
      State.tgUser = {
        id: p.get('tg_id'),
        first_name: p.get('tg_first') || '',
        last_name: p.get('tg_last') || '',
        username: p.get('tg_username') || '',
        photo_url: p.get('tg_photo') || '',
        language_code: p.get('tg_lang') || 'en',
        full_name: p.get('tg_name') || 'Guest User'
      };
    }
  }

  var base = getBasePath();
  var params = 'embed=1';
  if(State.tgUser){
    var u = State.tgUser;
    params += '&tg_id=' + encodeURIComponent(u.id)
      + '&tg_name=' + encodeURIComponent(u.full_name)
      + '&tg_first=' + encodeURIComponent(u.first_name)
      + '&tg_last=' + encodeURIComponent(u.last_name)
      + '&tg_username=' + encodeURIComponent(u.username)
      + '&tg_photo=' + encodeURIComponent(u.photo_url)
      + '&tg_lang=' + encodeURIComponent(u.language_code)
      + '&tg_platform=' + encodeURIComponent(State.platform);
  }
  document.querySelectorAll('.page-frame').forEach(function(f){
    var file = f.getAttribute('data-base');
    f.setAttribute('data-src', base + file + '?' + params);
  });
}

initTelegram();

/* ===== Get current route from URL (path-based, no #) ===== */
function getCurrentRoute(){
  var params = new URLSearchParams(location.search);
  var routeParam = params.get('route');
  if(routeParam){
    var page = routeParam.replace(/\//g,'');
    if(['bots','chart','plans','support'].indexOf(page) !== -1){
      return page;
    }
  }
  var path = location.pathname;
  var parts = path.split('/').filter(function(p){return p.length > 0;});
  var last = parts[parts.length - 1];
  if(['bots','chart','plans','support'].indexOf(last) !== -1){
    return last;
  }
  return 'bots';
}

/* ===== Logo Intro Sequence ===== */
(function(){
  var route = getCurrentRoute();
  if(route !== 'bots' || location.search.indexOf('route=') !== -1){
    document.getElementById('logoScreen').classList.add('hidden');
    State.appReady = true;
    showPage(route);
    if(location.search.indexOf('route=') !== -1){
      var basePath = getBasePath();
      history.replaceState(null, '', basePath + route);
    }
    return;
  }
  var logoScreen = document.getElementById('logoScreen');
  var logoContainer = document.getElementById('logoContainer');
  setTimeout(function(){
    logoContainer.classList.add('shown');
    setTimeout(function(){
      logoContainer.classList.add('expanded');
      setTimeout(function(){
        logoScreen.classList.add('hidden');
        document.getElementById('platformScreen').classList.add('visible');
      }, 1500);
    }, 3000);
  }, 2000);
})();

/* ===== Platform Selection ===== */
function selectPlatform(name){
  State.platform = name;
  initTelegram();
  var platformScreen = document.getElementById('platformScreen');
  platformScreen.classList.add('hidden');
  setTimeout(function(){
    platformScreen.classList.remove('visible');
    State.appReady = true;
    showPage('bots');
  }, 500);
}

/* ===== Page Navigation (path-based routing, no #) ===== */
function showPage(page){
  State.currentPage = page;
  var basePath = getBasePath();
  var newUrl = basePath + page;
  try{
    history.pushState({page:page}, '', newUrl);
  }catch(e){}

  document.querySelectorAll('.page-frame').forEach(function(f){
    f.classList.remove('active');
  });

  var frame = document.getElementById('frame-' + page);
  if(!frame) return;

  if(!State.loadedFrames[page]){
    var loader = document.getElementById('frameLoader');
    loader.classList.add('visible');
    frame.src = frame.getAttribute('data-src');
    frame.addEventListener('load', function(){
      loader.classList.remove('visible');
      State.loadedFrames[page] = true;
    });
    setTimeout(function(){
      loader.classList.remove('visible');
    }, 8000);
  }

  frame.classList.add('active');
}

/* ===== Handle browser back/forward ===== */
window.addEventListener('popstate', function(e){
  var page = getCurrentRoute();
  if(['bots','chart','plans','support'].indexOf(page) !== -1){
    State.currentPage = page;
    document.querySelectorAll('.page-frame').forEach(function(f){
      f.classList.remove('active');
    });
    var frame = document.getElementById('frame-' + page);
    if(frame){
      if(!State.loadedFrames[page]){
        var loader = document.getElementById('frameLoader');
        loader.classList.add('visible');
        frame.src = frame.getAttribute('data-src');
        frame.addEventListener('load', function(){
          loader.classList.remove('visible');
          State.loadedFrames[page] = true;
        });
        setTimeout(function(){loader.classList.remove('visible');}, 8000);
      }
      frame.classList.add('active');
    }
  }
});
</script>

</body>
</html>
