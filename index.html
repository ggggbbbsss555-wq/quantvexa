<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QuantVexa — All-in-One Trading Platform</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#000;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#fff;overflow:hidden;
}

/* ===== Logo Intro Screen ===== */
.logo-screen{
  position:fixed;inset:0;z-index:2000;
  background:#000;
  display:flex;justify-content:center;align-items:center;
  opacity:1;
  transition:opacity 0.6s ease;
}
.logo-screen.hidden{opacity:0;pointer-events:none}
.logo-container{
  width:460px;height:460px;
  position:relative;z-index:5;
  transform-origin:center center;
  transition:transform 3s cubic-bezier(0.22,1,0.36,1),
             opacity 1.5s ease,
             z-index 0.3s ease 2.5s;
  display:none;
  transform:translateY(20px);
}
.logo-container.shown{display:block}
.logo-container.expanded{
  transform:translateY(20px) scale(2.2);
  opacity:0.25;z-index:0;pointer-events:none;
}
.logo-container svg{width:100%;height:100%;overflow:visible;display:block}
.hexagon-border{
  fill:none;stroke:url(#cyanGrad);
  stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:320;stroke-dashoffset:320;
  animation:drawHex 3s ease-out forwards;
}
.hexagon{
  fill:none;stroke:url(#blueGrad);
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:320;stroke-dashoffset:320;
  animation:drawHex 3s ease-out forwards;
}
.bar{
  animation:growBar 2s ease-out forwards;
  opacity:0;fill:#000;stroke:url(#cyanGrad);
  stroke-width:2;stroke-linejoin:round;
  transform-box:fill-box;transform-origin:center bottom;
}
.bar-2{stroke-width:3}
.notch-fill{
  fill:none;stroke:url(#cyanGrad);
  stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:38;stroke-dashoffset:38;
  animation:revealHead 2s ease-out forwards;
}
.notch-fill-inner{
  fill:none;stroke:url(#blueGrad);
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:38;stroke-dashoffset:38;
  animation:revealHead 2s ease-out forwards;
}
@keyframes drawHex{to{stroke-dashoffset:0}}
@keyframes growBar{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes revealHead{to{stroke-dashoffset:0}}
@media (max-width:600px){
  .logo-container{width:300px;height:300px}
  .logo-container.expanded{transform:translateY(20px) scale(1.6)}
}
@media (max-width:380px){
  .logo-container{width:260px;height:260px}
  .logo-container.expanded{transform:translateY(20px) scale(1.5)}
}

/* ===== Platform Selector Screen ===== */
.platform-screen{
  position:fixed;inset:0;z-index:1900;
  background:#000;
  display:none;flex-direction:column;
  justify-content:center;align-items:center;
  padding:32px 20px;
  opacity:0;
  transition:opacity 0.5s ease;
}
.platform-screen.visible{display:flex;opacity:1}
.platform-screen.hidden{opacity:0;pointer-events:none}
.platform-screen-title{
  font-size:11px;font-weight:700;color:#00d2ff;
  letter-spacing:2.5px;text-transform:uppercase;
  margin-bottom:8px;
}
.platform-screen-heading{
  font-size:22px;font-weight:800;color:#fff;
  margin-bottom:36px;text-align:center;
  letter-spacing:0.3px;
}
.platform-buttons{
  display:flex;flex-direction:column;gap:14px;
  width:100%;max-width:360px;
}
.platform-btn{
  padding:22px 20px;
  background:linear-gradient(180deg,#131313 0%,#080808 100%);
  border:1px solid #1f1f1f;
  border-radius:14px;
  cursor:pointer;
  display:flex;align-items:center;gap:14px;
  transition:border-color 0.22s ease,background 0.22s ease;
  font-family:inherit;color:inherit;text-align:left;
}
.platform-btn:hover{
  border-color:#00d2ff;
  background:linear-gradient(180deg,rgba(0,210,255,0.06) 0%,#080808 100%);
}
.platform-btn-icon{
  width:48px;height:48px;flex-shrink:0;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);
  border:1px solid #00d2ff;
}
.platform-btn-icon svg{width:26px;height:26px;stroke:#000;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.platform-btn-info{flex:1;min-width:0}
.platform-btn-name{
  font-size:18px;font-weight:800;color:#fff;
  letter-spacing:0.5px;margin-bottom:2px;
}
.platform-btn-desc{
  font-size:11px;color:#888;font-weight:500;
  letter-spacing:0.2px;
}
.platform-btn-arrow{
  color:#555;font-size:18px;font-weight:700;
  transition:color 0.22s ease,transform 0.22s ease;
}
.platform-btn:hover .platform-btn-arrow{
  color:#00d2ff;transform:translateX(3px);
}
@media (max-width:480px){
  .platform-btn{padding:18px 16px}
  .platform-btn-icon{width:42px;height:42px}
  .platform-btn-name{font-size:16px}
}

/* ===== Main App Shell ===== */
.app-shell{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  opacity:0;
  transition:opacity 0.5s ease;
}
.app-shell.visible{opacity:1}

/* Top bar */
.shell-topbar{
  height:56px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:linear-gradient(180deg,#0d0d0d 0%,#000 100%);
  border-bottom:1px solid #1f1f1f;
  z-index:10;
}
.shell-brand{display:flex;align-items:center;gap:10px}
.shell-brand-mark{
  width:32px;height:32px;
  border-radius:8px;
  background:linear-gradient(135deg,rgba(0,210,255,0.15),rgba(0,153,204,0.05));
  border:1px solid rgba(0,210,255,0.3);
  display:flex;align-items:center;justify-content:center;
}
.shell-brand-mark svg{width:20px;height:20px}
.shell-brand-name{
  font-size:16px;font-weight:800;letter-spacing:0.3px;
  background:linear-gradient(135deg,#fff 0%,#00d2ff 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.shell-brand-sub{
  font-size:9px;font-weight:600;color:#666;
  letter-spacing:1.2px;text-transform:uppercase;
  margin-top:2px;
}
.shell-platform-badge{
  font-size:11px;
  padding:5px 10px;
  border-radius:6px;
  background:rgba(0,210,255,0.1);
  border:1px solid rgba(0,210,255,0.3);
  color:#00d2ff;
  letter-spacing:1px;
  font-weight:700;
}

/* Page container (iframes) */
.page-container{
  flex:1;
  position:relative;
  overflow:hidden;
}
.page-frame{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  border:none;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
  background:#000;
}
.page-frame.active{
  opacity:1;
  pointer-events:auto;
}

/* Bottom navigation */
.bottom-nav{
  height:64px;flex-shrink:0;
  display:flex;gap:0;
  background:linear-gradient(180deg,#0d0d0d 0%,#000 100%);
  border-top:1px solid #1f1f1f;
  z-index:20;
}
.nav-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  background:transparent;border:none;
  color:#888;cursor:pointer;
  transition:color 0.2s ease;
  position:relative;
  font-family:inherit;
}
.nav-item:hover{color:#fff}
.nav-item.active{color:#00d2ff}
.nav-item.active::before{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:40px;height:2px;
  background:#00d2ff;
  border-radius:2px;
}
.nav-item svg{
  width:22px;height:22px;
  stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform 0.2s ease;
}
.nav-item.active svg{transform:scale(1.08)}
.nav-item .nav-label{
  font-size:10px;font-weight:700;
  letter-spacing:0.5px;text-transform:uppercase;
}

/* Loading overlay for iframes */
.frame-loader{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  z-index:5;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s ease;
}
.frame-loader.visible{opacity:1;pointer-events:auto}
.frame-loader .spinner{
  width:32px;height:32px;
  border:2px solid rgba(0,210,255,0.2);
  border-top-color:#00d2ff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== Logo Intro Screen ===== -->
<div class="logo-screen" id="logoScreen">
  <div class="logo-container" id="logoContainer">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00d2ff"/>

          <stop offset="100%" style="stop-color:#00f0ff"/>

      </g>
      <path class="hexagon-border" d="M100 155 L40 120 L40 50 L57.1 40 M100 155 L160 120 L160 50 L142.9 40"/>
      <path class="hexagon" d="M100 155 L40 120 L40 50 L57.1 40 M100 155 L160 120 L160 50 L142.9 40"/>
      <path class="notch-fill" d="M100 14.8 L67 32.25"/>
      <path class="notch-fill" d="M100 14.8 L133 32.25"/>
      <path class="notch-fill-inner" d="M100 14.8 L67 32.25"/>
      <path class="notch-fill-inner" d="M100 14.8 L133 32.25"/>
    </svg>
  </div>
</div>

<!-- ===== Platform Selector Screen ===== -->
<div class="platform-screen" id="platformScreen">
  <div class="platform-screen-title">QuantVexa</div>
  <h1 class="platform-screen-heading">Select Trading Platform</h1>
  <div class="platform-buttons">
    <button class="platform-btn" onclick="selectPlatform('QUOTEX')">
      <div class="platform-btn-icon">
        <svg viewBox="0 0 24 24"><line x1="7" y1="3" x2="7" y2="21"/><rect x="4" y="7" width="6" height="9" fill="#000" fill-opacity="0.15"/><line x1="17" y1="2" x2="17" y2="22"/><rect x="14" y="10" width="6" height="7" fill="#000" fill-opacity="0.15"/></svg>
      </div>
      <div class="platform-btn-info">
        <div class="platform-btn-name">QUOTEX</div>

      </div>
      <div class="platform-btn-arrow">›</div>
    </button>
    <button class="platform-btn" onclick="selectPlatform('BINOLLA')">
      <div class="platform-btn-icon">
        <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
      </div>
      <div class="platform-btn-info">
        <div class="platform-btn-name">BINOLLA</div>
        <div class="platform-btn-desc">Smart advanced trading</div>
      </div>
      <div class="platform-btn-arrow">›</div>
    </button>
  </div>
</div>

<!-- ===== Main App Shell ===== -->
<div class="app-shell" id="appShell">

  <!-- Top Bar -->
  <div class="shell-topbar">
    <div class="shell-brand">
      <div class="shell-brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
          <line x1="12" y1="22" x2="12" y2="15.5"/>
          <polyline points="22 8.5 12 15.5 2 8.5"/>
        </svg>
      </div>
      <div>
        <div class="shell-brand-name">QuantVexa</div>
        <div class="shell-brand-sub">Control Center</div>
      </div>
    </div>
    <div class="shell-platform-badge" id="shellPlatform">QUOTEX</div>
  </div>

  <!-- Page Container (iframes) -->
  <div class="page-container" id="pageContainer">
    <div class="frame-loader" id="frameLoader"><div class="spinner"></div></div>
    <iframe class="page-frame" id="frame-dashboard" data-src="https://ggggbbbsss555-wq.github.io/qxbot/?embed=1"></iframe>
    <iframe class="page-frame" id="frame-signals" data-src="https://ggggbbbsss555-wq.github.io/ERQQ/?embed=1"></iframe>
    <iframe class="page-frame" id="frame-wallet" data-src="https://ggggbbbsss555-wq.github.io/Support/?embed=1"></iframe>
    <iframe class="page-frame" id="frame-settings" data-src="https://ggggbbbsss555-wq.github.io/Support1/?embed=1"></iframe>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-item" data-page="signals" onclick="showPage('signals')">
      <svg viewBox="0 0 24 24"><line x1="5" y1="4" x2="5" y2="20" stroke-width="1.2"/><rect x="3.2" y="7" width="3.6" height="8" fill="#fff" stroke="none"/><line x1="12" y1="3" x2="12" y2="19" stroke-width="1.2"/><rect x="10.2" y="5" width="3.6" height="9" fill="#fff" stroke="none"/><line x1="19" y1="6" x2="19" y2="21" stroke-width="1.2"/><rect x="17.2" y="9" width="3.6" height="7" fill="#fff" stroke="none"/></svg>
      <span class="nav-label">Signals</span>

      <span class="nav-label">Wallet</span>
    </button>
    <button class="nav-item" data-page="settings" onclick="showPage('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </div>

</div>

<script>
/* ===== State ===== */
var State = {
  platform: 'QUOTEX',
  currentPage: 'dashboard',
  loadedFrames: {}
};

/* ===== Logo Intro Sequence ===== */
(function(){
  var logoScreen = document.getElementById('logoScreen');
  var logoContainer = document.getElementById('logoContainer');
  setTimeout(function(){
    logoContainer.classList.add('shown');
    setTimeout(function(){
      logoContainer.classList.add('expanded');
      setTimeout(function(){
        logoScreen.classList.add('hidden');
        document.getElementById('platformScreen').classList.add('visible');
      }, 1500);
    }, 3000);
  }, 2000);
})();

/* ===== Platform Selection ===== */
function selectPlatform(name){
  State.platform = name;
  document.getElementById('shellPlatform').textContent = name;
  var platformScreen = document.getElementById('platformScreen');
  platformScreen.classList.add('hidden');
  setTimeout(function(){
    platformScreen.classList.remove('visible');
    document.getElementById('appShell').classList.add('visible');
    // Load the default page (dashboard)
    showPage('dashboard');
  }, 500);
}

/* ===== Page Navigation (hash-based routing) ===== */
function showPage(page){
  State.currentPage = page;

  // Update URL hash without triggering hashchange loop
  if(location.hash !== '#' + page){
    try{history.replaceState(null,'','#'+page);}catch(e){}
  }

  // Update nav buttons
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-page') === page);
  });

  // Hide all frames
  document.querySelectorAll('.page-frame').forEach(function(f){
    f.classList.remove('active');
  });

  // Show target frame
  var frame = document.getElementById('frame-' + page);
  if(!frame) return;

  // Lazy-load: set src only once
  if(!State.loadedFrames[page]){
    var loader = document.getElementById('frameLoader');
    loader.classList.add('visible');
    frame.src = frame.getAttribute('data-src');
    frame.addEventListener('load', function(){
      loader.classList.remove('visible');
      State.loadedFrames[page] = true;
    });
    // Fallback: hide loader after 8s even if load event doesn't fire
    setTimeout(function(){
      loader.classList.remove('visible');
    }, 8000);
  }

  frame.classList.add('active');
}

/* ===== Hash-based routing on page load ===== */
window.addEventListener('hashchange', function(){
  var page = location.hash.replace('#','') || 'dashboard';
  if(['dashboard','signals','wallet','settings'].indexOf(page) !== -1){
    showPage(page);
  }
});

/* ===== Handle initial hash (if user navigates directly to #signals etc.) ===== */
// This runs after platform selection, handled in selectPlatform -> showPage
</script>
